events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Raster (GeoTIFF) uploads can be hundreds of MB; 100M rejected real
    # country rasters at the inspect step (HTTP 413). nginx streams the body to
    # a temp file, so a large ceiling costs disk, not memory.
    client_max_body_size 1G;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Rate-limit zones (10 MB ≈ 160 000 unique IPs).
    # login_zone: 5 req/s per IP, used on /api/auth/login (sis-api itself
    #   already locks an account after 5 failed attempts; this guards the
    #   endpoint from being hammered by a single IP across many usernames).
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;

    # Hide nginx version
    server_tokens off;

    # HTTP Server
    server {
        listen 80;
        server_name localhost;

        # Redirect to HTTPS (uncomment when SSL is configured)
        # return 301 https://$server_name$request_uri;

        # Baseline hardening headers — applied to every response from this
        # server block. When TLS is enabled, also add `Strict-Transport-Security`.
        add_header X-Frame-Options          "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options   "nosniff"                          always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy       "geolocation=(self), camera=(), microphone=()" always;
        # Strict-Transport-Security only over HTTPS — uncomment with TLS:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Login endpoint — rate-limit at the gateway as a second line of
        # defence on top of the per-account lockout in sis-api.
        location = /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;
            set $upstream_api sis-api:8000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root location - Web Mapping Application (OpenLayers)
        location / {
            set $upstream_web_mapping sis-web-mapping:8000;
            proxy_pass http://$upstream_web_mapping;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API endpoints - FastAPI REST API
        location /api/ {
            set $upstream_api sis-api:8000;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Health check endpoint
        location /api/health {
            set $upstream_api sis-api:8000;
            proxy_pass http://$upstream_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Metadata service - pyCSW
        location /metadata/ {
            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CSW endpoint alias. NB: with a variable upstream, a URI on
        # proxy_pass replaces the request URI VERBATIM — the old
        # "…$upstream_metadata/csw" form dropped the query string, so every
        # CSW request answered as GetCapabilities. $request_uri keeps
        # path + query intact.
        location /csw {
            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # pyCSW Collections root endpoint (without trailing slash)
        location = /collections {
            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # pyCSW Collections endpoint (OGC API - Records)
        location /collections/ {
            # CORS — allow the frontend to fetch metadata from any origin
            # (useful when the page is loaded from the Parcel dev port 8001)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;

            set $upstream_metadata sis-metadata:8000;
            # Pass the full path including /collections/ to pyCSW
            proxy_pass http://$upstream_metadata$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure JSON responses are handled correctly
            proxy_set_header Accept "application/json";
        }

        # GloSIS federation API (only active when sis-api-glosis container is
        # running). The container serves at the root, so the /glosis/ prefix
        # must be stripped — but "…$upstream_glosis/" (variable upstream +
        # URI) replaced the WHOLE path with "/", so every endpoint returned
        # the welcome banner. Strip the prefix explicitly instead; the
        # rewritten URI plus query string is then passed through.
        location /glosis/ {
            set $upstream_glosis sis-api-glosis:8000;
            rewrite ^/glosis/(.*)$ /$1 break;
            proxy_pass http://$upstream_glosis;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # MapServer - Web Map Services (WMS/WFS)
        location /mapserver {
            set $upstream_mapserver sis-web-services:80;
            # Remove trailing slash and use $is_args$args to properly append query string
            proxy_pass http://$upstream_mapserver$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            
            # Explicitly preserve query string
            proxy_set_header X-Original-URI $request_uri;
        }

        # WMS endpoint alias
        location /wms {
            set $upstream_mapserver sis-web-services:80;
            proxy_pass http://$upstream_mapserver$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # WFS endpoint alias
        location /wfs {
            set $upstream_mapserver sis-web-services:80;
            proxy_pass http://$upstream_mapserver$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Raster downloads — serves GeoTIFFs from the shared MapServer volume.
        # Only .tif/.tiff files are exposed; everything else (.map, dotfiles, dirs) is denied.
        location ~* ^/downloads/(?<_raster_file>[^/]+\.tiff?)$ {
            alias /srv/rasters/$_raster_file;
            default_type application/octet-stream;
            add_header Content-Disposition 'attachment';
            add_header X-Content-Type-Options nosniff;
        }

        location /downloads/ {
            return 403;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # HTTPS Server (uncomment and configure when SSL certificates are ready)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #
    #     # SSL certificates
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
