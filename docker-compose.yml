services:

# # DEVELOPMENT
# sis-nginx:        80:80, 443:443
# sis-web-mapping:  8001:8000
# sis-api:          8002:8000
# sis-metadata:     8003:8000
# sis-web-services: 8004:80
# sis-database:     8005:5432

# # PRODUCTION (only nginx exposed)
# sis-nginx:        80:80, 443:443  # Only this exposed!
# sis-web-mapping:  expose: 8000    # Internal only
# sis-api:          expose: 8000
# sis-metadata:     expose: 8000
# sis-web-services: expose: 80
# sis-database:     expose: 5432


  # sis-database (PostgreSQL)
  # NOT published to the host. Use `docker exec sis-database psql -U sis -d sis`
  # for local administration. To expose to the host for tooling like pgAdmin,
  # use a per-developer docker-compose.override.yml (gitignored) that adds:
  #   sis-database:
  #     ports:
  #       - "127.0.0.1:8005:5432"
  sis-database:
    container_name: sis-database
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - ./sis-database/volume:/var/lib/postgresql/data
    networks:
      - sis-net
    restart: unless-stopped

  # sis-api REST API (FastAPI)
  sis-api:
    container_name: sis-api
    build:
      context: ./sis-api
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      PYCSW_URL: http://sis-metadata:8000
      MAPSERVER_WMS_URL: http://localhost/mapserver
      # Version stamp for the Administration → Software & updates panel.
      # deploy.sh / update.sh export GIT_SHA before bringing sis-api up.
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      # Raster registry / DST engine needs to read & write TIFFs that
      # MapServer also serves. Read-write so DST runs can drop outputs.
      - ./sis-web-services/volume:/srv/rasters
      # XML records loaded by pyCSW — registrar writes here when registering a raster.
      - ./sis-metadata/volume:/srv/pycsw-records
    ports:
      - "8002:8000"
    depends_on:
      - sis-database
    networks:
      - sis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # sis-nginx (Nginx reverse proxy)
  sis-nginx:
    image: nginx:alpine
    container_name: sis-nginx
    volumes:
      - ./sis-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sis-web-services/volume:/srv/rasters:ro
      # - ./sis-nginx/ssl:/etc/nginx/ssl:ro
    # With the optional `tls` profile (see the caddy service), Caddy takes the
    # host's 80/443 and nginx retreats to loopback: set NGINX_HTTP_BIND and
    # NGINX_HTTPS_BIND in .env (e.g. 127.0.0.1:8080 / 127.0.0.1:8443).
    ports:
      - "${NGINX_HTTP_BIND:-80}:80"
      - "${NGINX_HTTPS_BIND:-443}:443"
    depends_on:
      sis-api:
        condition: service_healthy
      sis-database:
        condition: service_started
    networks:
      - sis-net
    restart: unless-stopped

  # sis-metadata (pyCSW)
  # Built from sis-metadata/Dockerfile: the pinned 3.0.0-beta1 digest plus a
  # build-time patch for an upstream serialisation bug that drops the licence
  # from OGC API Records list responses (see sis-metadata/patch_license.py).
  # Re-pin to a stable 3.0.x tag and drop the patch once geopython fixes it.
  sis-metadata:
    container_name: sis-metadata
    build: ./sis-metadata
    environment:
      PYCSW_SERVER_URL: http://localhost:8003
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 8003:8000
    volumes:
      - ./sis-metadata/pycsw.yml:/etc/pycsw/pycsw.yml
      - ./sis-metadata/volume:/records
    networks:
      - sis-net
    depends_on:
      - sis-database
    restart: unless-stopped

  # sis-web-services (MapServer)
  sis-web-services:
    container_name: sis-web-services
    image: camptocamp/mapserver:8.4
    ports:
      - "8004:80"
    volumes:
      - ./sis-web-services/volume:/etc/mapserver:ro
    depends_on:
      - sis-database
    networks:
      - sis-net
    restart: unless-stopped

# sis-api-glosis (GloSIS federation data API)
# Connects to Postgres as the read-only sis_glosis role, which only has SELECT
# on api.vw_api_manifest, vw_api_profile, vw_api_observation. Even with a
# valid federation token, callers cannot read or write anything else.
  sis-api-glosis:
    container_name: sis-api-glosis
    build:
      context: .
      dockerfile: sis-api-glosis/Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_GLOSIS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_GLOSIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    ports:
      - "8006:8000"
    depends_on:
      - sis-database
    networks:
      - sis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# sis-web-mapping (OpenLayers)
  sis-web-mapping:
    container_name: sis-web-mapping
    build: 
      context: ./sis-web-mapping
      dockerfile: Dockerfile
      args:
        # Relative URLs so the SPA calls its own origin — works on a domain or
        # a bare IP, http or https, with no rebuild when the host changes. The
        # old http://localhost defaults only worked when the browser ran on the
        # server itself. Override via .env only if the API / MapServer are
        # served from a different origin.
        API_URL: ${API_URL:-}
        API_KEY: ${WEB_MAPPING_API_KEY}
        MAPSERVER_URL: ${MAPSERVER_URL:-/mapserver}
    ports:
      - "8001:8000"
    networks:
      - sis-net
    depends_on:
      - sis-api
      - sis-web-services
      - sis-metadata
    restart: unless-stopped

  # Optional automatic-HTTPS front (dormant unless the `tls` profile is on).
  # Terminates TLS with Let's Encrypt certificates for ${DOMAIN} and proxies
  # everything to sis-nginx over the internal network — nothing behind it
  # changes. Enable by setting in .env:
  #   DOMAIN=soil.example.org
  #   COMPOSE_PROFILES=tls
  #   NGINX_HTTP_BIND=127.0.0.1:8080
  #   NGINX_HTTPS_BIND=127.0.0.1:8443
  # Prerequisites and precautions: see "Enabling HTTPS" in the README. Never
  # enable on a shared multi-instance host.
  sis-caddy:
    image: caddy:2-alpine
    container_name: sis-caddy
    profiles: ["tls"]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./sis-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # certificates + ACME account — must persist
      - caddy-config:/config
    networks:
      - sis-net
    depends_on:
      - sis-nginx
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  sis-net:
    driver: bridge
    name: sis-net
