<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Information System</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var _t = localStorage.getItem('sis-theme');
        if (_t !== 'dark' && _t !== 'light') {
          _t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = _t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.1/ol.css">
    <!-- Favicon and header logo are set at runtime from api.setting ORG_LOGO_URL -->
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="header">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Soil Information System" class="logo">
        <h1>Soil Information System</h1>
    </div>

    <div id="map" class="map"></div>
    
    <div id="popup" class="popup">
        <div id="popup-content"></div>
        <button id="popup-closer" class="popup-closer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="display: block; margin: auto;">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
    </div>
    
    <div id="layer-switcher" class="layer-switcher">
        <div class="layer-switcher-header">
            <button id="collapse-btn" class="collapse-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display: block; margin: auto;" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
        <div class="layer-switcher-content">
            <div id="layer-groups"></div>
            <div class="opacity-control">
                <label for="opacity" style="display: block; text-align: center; font-size: 12px; margin-bottom: 5px;">Opacity</label>
                <input type="range" id="opacity" min="0" max="1" step="0.1" value="1">
                <span id="opacity-tip" class="opacity-tip"></span>
            </div>
        </div>
    </div>

    <div class="map-controls">
        <!-- Same visual family as the login/language buttons: borderless
             stroke icons, white with a drop shadow. -->
        <div class="north-arrow" title="N">
            <svg viewBox="0 0 24 24" width="44" height="60" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
                <path d="M12 2 L16.5 15 L12 12.2 L7.5 15 Z" stroke-linejoin="round"/>
                <path d="M9.5 22v-4.5l5 4.5v-4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="zoom-controls">
            <button id="zoom-in" aria-label="+">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            </button>
            <button id="zoom-out" aria-label="-">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>

    <div id="scale-line" class="scale-line"></div>

    <div id="legend" class="legend-container">
        <div class="legend-content"></div>
    </div>

    <!-- Loading overlay (shown during initialization) -->
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 10000; align-items: center; justify-content: center; font-size: 24px;">
        <div>Loading Soil Information System...</div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
