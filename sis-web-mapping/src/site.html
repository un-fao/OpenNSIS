<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Information System</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var _t = localStorage.getItem('sis-theme');
        if (_t !== 'dark' && _t !== 'light') {
          _t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = _t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="./css/site.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Filled by site.js from GET /api/site. While the landing is disabled
         the script replaces the location with /map, so this shell stays
         intentionally empty (no flash of placeholder content). -->
    <main id="site" hidden>
        <header class="site-header">
            <div class="brand">
                <img id="site-logo" alt="" hidden>
            </div>
            <nav>
                <a id="site-map-link" class="btn-pill" href="/map"></a>
            </nav>
        </header>

        <section class="hero">
            <div class="hero-text">
                <h1 id="hero-title"></h1>
                <p id="hero-subtitle"></p>
                <div class="hero-actions">
                    <a class="btn-pill btn-lg" href="/map" id="hero-cta"></a>
                    <a class="btn-ghost" href="/collections?f=html" id="hero-catalogue"></a>
                </div>
            </div>
            <div class="hero-visual">
                <div class="hero-image" id="hero-image" hidden></div>
                <!-- Default artwork when no hero image is set: a stylised soil
                     profile — wavy horizons from topsoil to parent material. -->
                <svg id="hero-art" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <rect x="0" y="0" width="420" height="520" fill="var(--strata-sky)"/>
                    <path d="M0 96 Q70 76 140 92 T280 88 T420 96 L420 520 L0 520 Z" fill="var(--strata-1)"/>
                    <path d="M0 190 Q90 168 180 186 T420 182 L420 520 L0 520 Z" fill="var(--strata-2)"/>
                    <path d="M0 300 Q110 280 210 296 T420 290 L420 520 L0 520 Z" fill="var(--strata-3)"/>
                    <path d="M0 410 Q120 392 230 404 T420 400 L420 520 L0 520 Z" fill="var(--strata-4)"/>
                    <g stroke="var(--strata-root)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55">
                        <path d="M210 96 C 205 150, 225 180, 215 235 C 208 275, 220 300, 214 330"/>
                        <path d="M210 150 C 185 170, 170 200, 158 228"/>
                        <path d="M212 190 C 240 212, 252 238, 262 268"/>
                        <path d="M214 250 C 195 272, 188 292, 184 312"/>
                    </g>
                    <g fill="var(--strata-stone)" opacity="0.7">
                        <ellipse cx="90" cy="345" rx="11" ry="7"/>
                        <ellipse cx="330" cy="365" rx="14" ry="8"/>
                        <ellipse cx="150" cy="455" rx="16" ry="9"/>
                        <ellipse cx="290" cy="470" rx="10" ry="6"/>
                        <ellipse cx="60" cy="480" rx="12" ry="7"/>
                    </g>
                </svg>
            </div>
        </section>

        <section class="about-wrap">
            <article class="about" id="about" hidden></article>
        </section>

        <footer class="site-footer" id="site-footer" hidden></footer>
    </main>
    <script type="module" src="./js/site.js"></script>
</body>
</html>
