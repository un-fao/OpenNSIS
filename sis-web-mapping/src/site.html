<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Information System</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var _t = localStorage.getItem('sis-theme');
        if (_t !== 'dark' && _t !== 'light') {
          _t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = _t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="./css/site.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Filled by site.js from GET /api/site. While the landing is disabled
         the script replaces the location with /map, so this shell stays
         intentionally empty (no flash of placeholder content). -->
    <header class="site-header" id="site-header" hidden>
        <div class="site-header-inner">
            <div class="brand">
                <img id="site-logo" alt="" hidden>
                <span class="site-name" id="site-name"></span>
            </div>
            <nav class="site-nav" aria-label="Main">
                <a id="nav-home" href="/" class="nav-link nav-current"></a>
                <span id="nav-about" class="nav-link nav-soon"></span>
                <a id="nav-news" href="/news" class="nav-link" style="display:none"></a>
                <a id="nav-map" href="/map" class="nav-link"></a>
                <a id="nav-catalogue" href="/catalogue" class="nav-link"></a>
                <a id="nav-dashboard" href="/dashboard" class="nav-link"></a>
                <span id="nav-people" class="nav-link nav-soon"></span>
                <span id="nav-contact" class="nav-link nav-soon"></span>
                <a id="nav-admin" href="/admin" class="nav-link" style="display:none"></a>
            </nav>
            <div class="site-controls" id="site-controls"></div>
        </div>
    </header>
    <main id="site" class="landing" hidden>

        <section class="land-hero" id="top">
            <div class="land-wrap land-hero-inner">
                <h1 id="hero-title"></h1>
                <p id="hero-subtitle"></p>
                <div class="land-hero-actions">
                    <a class="btn-pill btn-lg" href="/map" id="hero-map"></a>
                    <a class="btn-outline btn-lg" href="/catalogue" id="hero-cta"></a>
                </div>
            </div>
        </section>

        <section class="land-section land-paper" id="start">
            <div class="land-wrap">
                <div class="land-head">
                    <h2 id="quick-title"></h2>
                    <p id="quick-lede"></p>
                </div>
                <div class="land-grid land-grid-4" id="quick-grid"></div>
            </div>
        </section>

        <section class="land-section land-paper" id="about-section">
            <div class="land-wrap">
                <div class="land-about-col">
                    <h2 class="land-about-title" id="about-title"></h2>
                    <div class="about land-about-body" id="about"></div>
                    <a class="btn-pill" id="about-cta" hidden></a>
                </div>
            </div>
        </section>

        <footer class="land-footer" id="site-footer">
            <div class="land-wrap">
                <div class="land-footer-top">
                    <div class="land-footer-name" id="footer-name"></div>
                    <nav class="land-footer-nav" id="footer-nav"></nav>
                </div>
                <div class="land-footer-note" id="footer-custom" hidden></div>
            </div>
        </footer>
    </main>
    <script type="module" src="./js/site.js"></script>
</body>
</html>
